<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1a2n track id overlay</title>
<style>
  :root {
    --card-bg: rgba(12, 12, 16, 0.78);
    --card-border: rgba(255, 255, 255, 0.10);
    --text: #f2f2f5;
    --text-dim: rgba(242, 242, 245, 0.55);
    --accent: #27e0a6;
    --onair: #ff3b5c;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    padding: 16px;
  }
  #overlay-root { display: flex; flex-direction: column; gap: 14px; }

  /* now playing hero */
  .hero {
    display: flex; align-items: center; gap: 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px 18px;
    backdrop-filter: blur(6px);
    max-width: 640px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .hero.visible { opacity: 1; transform: none; }
  .hero .art {
    width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
    background: #222 center/cover no-repeat;
    flex: none;
  }
  .hero .meta { min-width: 0; }
  .hero .title {
    font-size: 22px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hero .artist { font-size: 16px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .badge {
    margin-left: auto; flex: none;
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    color: var(--onair); border: 1px solid var(--onair);
    border-radius: 6px; padding: 3px 8px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }

  /* deck grid */
  .decks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .deck {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 10px 12px;
    backdrop-filter: blur(6px);
    transition: border-color .3s ease, box-shadow .3s ease;
    min-height: 92px;
  }
  .deck.onair { border-color: var(--onair); box-shadow: 0 0 14px rgba(255, 59, 92, .35); }
  .deck .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .deck .letter {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,.12);
  }
  .deck.onair .letter { background: var(--onair); }
  .deck.playing .letter { outline: 2px solid var(--accent); }
  .deck .stats { margin-left: auto; font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .deck .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck .artist { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck .empty { color: var(--text-dim); font-size: 12px; font-style: italic; }
  .deck .art { float: left; width: 40px; height: 40px; border-radius: 6px; margin-right: 8px; object-fit: cover; background: #222; }

  /* history */
  .history {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 12px 16px;
    backdrop-filter: blur(6px);
    max-width: 480px;
  }
  .history h2 {
    font-size: 11px; font-weight: 700; letter-spacing: .14em;
    color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase;
  }
  .history ol { list-style: none; display: flex; flex-direction: column-reverse; gap: 5px; }
  .history li { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history li .h-artist { color: var(--text-dim); }
  .history li:last-child { animation: slidein .4s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-10px); } }

  body[data-view="now"] .decks, body[data-view="now"] .history { display: none; }
  body[data-view="decks"] .hero, body[data-view="decks"] .history { display: none; }
  body[data-view="history"] .hero, body[data-view="history"] .decks { display: none; }
</style>
</head>
<body>
<div id="overlay-root"></div>
<script src="/overlay.js"></script>
</body>
</html>
