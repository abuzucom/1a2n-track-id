<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1a2n track id overlay</title>
<style>
  /* Brand fonts, self-hosted: the overlay makes no external requests. */
  @font-face { font-family: "Libre Franklin"; font-weight: 400; font-display: swap; src: url("/fonts/libre-franklin-400.woff2") format("woff2"); }
  @font-face { font-family: "Libre Franklin"; font-weight: 500; font-display: swap; src: url("/fonts/libre-franklin-500.woff2") format("woff2"); }
  @font-face { font-family: "Libre Franklin"; font-weight: 900; font-display: swap; src: url("/fonts/libre-franklin-900.woff2") format("woff2"); }
  @font-face { font-family: "Cousine"; font-weight: 400; font-display: swap; src: url("/fonts/cousine-400.woff2") format("woff2"); }
  @font-face { font-family: "Cousine"; font-weight: 700; font-display: swap; src: url("/fonts/cousine-700.woff2") format("woff2"); }

  /* Brand palette */
  :root {
    --pitch: #0B0B0B;
    --paper: #EAE7E1;
    --charcoal: #242424;
    --concrete: #A6A39D;
    --dull-silver: #74777A;

    --card-bg: rgba(11, 11, 11, 0.88);
    /* Kept as two separate variables even though the values match today:
       display (stat/hero text) and editorial (body text) are allowed to
       diverge independently later without touching call sites. */
    --font-display: "Libre Franklin", system-ui, sans-serif;
    --font-editorial: "Libre Franklin", system-ui, sans-serif;
    --font-utility: "Cousine", monospace;
    --radius: 2px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: transparent; }
  body {
    font-family: var(--font-editorial);
    font-weight: 400;
    color: var(--paper);
    padding: 16px;
    overflow: hidden;
    background: var(--pitch); /* dark theme default */
  }
  body[data-theme="paper"] { background: var(--paper); }
  body[data-theme="grey"] { background: var(--dull-silver); }
  body[data-theme="transparent"] { background: transparent; }
  /* Cards stay Pitch in every theme; lift them off non-dark grounds. */
  body[data-theme="paper"] .card, body[data-theme="grey"] .card { border-color: var(--pitch); }

  #overlay-root { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--charcoal);
    border-radius: var(--radius);
  }

  /* theme toggle */
  #theme-toggle {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    font-family: var(--font-utility); font-weight: 700;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--concrete); background: var(--card-bg);
    border: 1px solid var(--charcoal); border-radius: var(--radius);
    padding: 4px 8px; cursor: pointer;
    opacity: .25; transition: opacity .2s ease;
  }
  #theme-toggle:hover { opacity: 1; }

  /* now playing: fixed 2x2 grid mirroring the deck layout; empty slots keep
     their space so nothing shifts when decks come on or off air */
  #heroes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .hero {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    min-height: 100px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .hero.visible { opacity: 1; transform: none; }
  .hero .art {
    width: 72px; height: 72px; border-radius: var(--radius); object-fit: cover;
    background: var(--charcoal) center/cover no-repeat;
    flex: none;
  }
  .hero .meta { min-width: 0; }
  .hero .title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: .01em;
    white-space: nowrap; overflow: hidden;
  }
  .hero .artist {
    font-weight: 500; font-size: 16px; color: var(--concrete);
    white-space: nowrap; overflow: hidden;
  }
  .hero .stats {
    margin-left: auto; flex: none;
    font-family: var(--font-utility);
    font-size: 10px; color: var(--dull-silver);
    text-align: right;
  }
  .hero .badge {
    margin-left: auto; flex: none;
    font-family: var(--font-utility);
    font-weight: 700;
    font-size: 11px; letter-spacing: .14em;
    border-radius: var(--radius); padding: 4px 9px;
  }
  .hero .badge.onair {
    color: var(--pitch); background: var(--paper);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .55; } }

  /* Marquee: only applied (via the .marquee class) to titles/artists that
     actually overflow their box; scrolls to reveal the rest, holds, then
     snaps back. Pure CSS animation, no <marquee> and no rAF (OBS suspends
     rAF in backgrounded browser sources). */
  .title .marquee-text, .artist .marquee-text { display: inline-block; white-space: nowrap; }
  .marquee .marquee-text {
    animation: marquee-scroll 8s ease-in-out infinite;
  }
  @keyframes marquee-scroll {
    0%, 10% { transform: translateX(0); }
    45%, 55% { transform: translateX(var(--marquee-shift, 0px)); }
    90%, 100% { transform: translateX(0); }
  }

  /* deck grid: fixed 2x2, A B over C D, at every width */
  .decks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .deck {
    padding: 10px 12px;
    transition: border-color .3s ease, box-shadow .3s ease;
    min-height: 92px;
  }
  .deck.onair { border-color: var(--paper); box-shadow: 0 0 12px rgba(234, 231, 225, .25); }
  /* Gentle end-of-track pulse: 0.5 Hz, small opacity swing (photosensitivity-safe). */
  .deck.ending { animation: ending-pulse 2s ease-in-out infinite; }
  @keyframes ending-pulse { 50% { border-color: var(--concrete); opacity: .75; } }
  .deck .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .deck .letter {
    width: 22px; height: 22px; border-radius: var(--radius);
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-weight: 900; font-size: 12px;
    color: var(--paper); background: var(--charcoal);
  }
  .deck.onair .letter { color: var(--pitch); background: var(--paper); }
  .deck.playing .letter { outline: 1px solid var(--concrete); outline-offset: 1px; }
  .deck .stats {
    margin-left: auto;
    font-family: var(--font-utility);
    font-size: 10px; color: var(--dull-silver);
  }
  .deck .title {
    font-weight: 500; font-size: 14px;
    white-space: nowrap; overflow: hidden;
  }
  .deck .artist { font-size: 12px; color: var(--concrete); white-space: nowrap; overflow: hidden; }
  .deck .empty { color: var(--dull-silver); font-family: var(--font-utility); font-size: 11px; }
  /* flow-root contains the floated EQ meter and art thumbnail below. */
  .deck .body { display: flow-root; }
  .deck .art { float: left; width: 40px; height: 40px; border-radius: var(--radius); margin-right: 8px; object-fit: cover; background: var(--charcoal); }
  .deck .tag {
    font-family: var(--font-utility); font-weight: 700;
    font-size: 9px; letter-spacing: .1em;
    color: var(--concrete); border: 1px solid var(--concrete);
    border-radius: var(--radius); padding: 1px 5px;
  }
  .deck .compat {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--paper); flex: none;
    display: none;
  }
  .deck.compatible .compat { display: block; }
  /* EQ: compact meter floated left, at the same height as the title/artist
     text beside it rather than its own banner row. */
  .deck .eq {
    float: left; display: flex; gap: 4px; align-items: flex-end;
    height: 36px; margin-right: 8px;
  }
  .deck .eq-col { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
  .deck .eq-track {
    display: block; width: 6px; flex: 1 1 auto; min-height: 0;
    background: var(--charcoal); position: relative; overflow: hidden;
    border-radius: 1px;
  }
  .deck .eq-track::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: var(--dull-silver); opacity: .5;
  }
  .deck .eq-track i {
    position: absolute; left: 0; width: 100%;
    background: var(--concrete);
    bottom: 50%; height: 0;
    transition: height .15s ease, bottom .15s ease;
  }
  .deck .eq-label {
    font-family: var(--font-utility); font-weight: 700;
    font-size: 8px; letter-spacing: .04em; line-height: 1;
    color: var(--dull-silver); flex: none;
  }
  /* history */
  .history {
    padding: 12px 16px;
    max-width: 400px;
  }
  .history h2 {
    font-family: var(--font-utility);
    font-weight: 700;
    font-size: 10px; letter-spacing: .16em;
    color: var(--dull-silver); margin-bottom: 8px; text-transform: uppercase;
  }
  .history ol { list-style: none; display: flex; flex-direction: column-reverse; gap: 5px; }
  .history li { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history li .h-artist { color: var(--concrete); }
  .history li:last-child { animation: slidein .4s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-10px); } }

  body[data-view="now"] .decks, body[data-view="now"] .history { display: none; }
  body[data-view="decks"] #heroes, body[data-view="decks"] .history { display: none; }
  body[data-view="history"] #heroes, body[data-view="history"] .decks { display: none; }
</style>
</head>
<body>
<div id="overlay-root"></div>
<script src="/overlay.js"></script>
</body>
</html>
