name: Convention Sync Check

on:
  push:
    branches: [ main ]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CONVENTIONS.md'
      - '.cursorrules'
      - '.clinerules'
      - '.windsurfrules'
      - '.copilot-instructions'
      - '.github/copilot-instructions.md'
      - 'scripts/sync.py'
      - 'scripts/lint_style.py'
      - '.github/workflows/sync-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CONVENTIONS.md'
      - '.cursorrules'
      - '.clinerules'
      - '.windsurfrules'
      - '.copilot-instructions'
      - '.github/copilot-instructions.md'
      - 'scripts/sync.py'
      - 'scripts/lint_style.py'
      - '.github/workflows/sync-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run sync check
        run: python scripts/sync.py --check
      - name: Run style lint
        run: python scripts/lint_style.py
