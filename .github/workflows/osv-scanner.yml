# Scan repository dependencies for vulnerabilities using OSV-Scanner.
# Run scheduled scans on the default branch.
# Run verification checks on pull requests and merge groups.
name: OSV-Scanner
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    # Run every Monday at 06:28 UTC.
    - cron: '28 6 * * 1'
  push:
    branches: [main]
permissions:
  # Upload SARIF findings to the GitHub Security tab.
  security-events: write
  # Read repository contents for scanning.
  contents: read
  # The v2.6.0 reusable scan jobs request this scope. A called workflow
  # cannot exceed the caller's grant, so omitting it fails the run.
  actions: read
jobs:
  scan-scheduled:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    # v2.6.0
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc
    with:
      # Recursively scan repository files while skipping Git history.
      scan-args: |-
        -r
        --skip-git
        ./
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    # v2.6.0
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc
    with:
      # Recursively scan repository files while skipping Git history.
      scan-args: |-
        -r
        --skip-git
        ./
