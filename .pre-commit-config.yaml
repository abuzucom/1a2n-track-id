repos:
  - repo: local
    hooks:
      - id: policy-tests
        name: policy tests
        entry: python scripts/run_tests.py
        language: system
        pass_filenames: false
      - id: policy-sync
        name: policy sync
        entry: python scripts/sync.py --check
        language: system
        pass_filenames: false
      - id: external-pr-refs
        name: external pull request references
        entry: python scripts/check_external_pr_refs.py
        language: system
        pass_filenames: false
      - id: check-conflict-markers
        name: check conflict markers
        entry: python scripts/check_conflict_markers.py --staged
        language: system
        always_run: true
        pass_filenames: false
